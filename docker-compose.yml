version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nf-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nf-net
    # Needs a command to pull the model if not exists, but we'll instruct the user in README

  api:
    build: ./app
    container_name: nf-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - nf-net

  frontend:
    build: ./streamlit_app
    container_name: nf-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - nf-net

networks:
  nf-net:
    driver: bridge

volumes:
  ollama_data:
